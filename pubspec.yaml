name: easy_date_timeline
description: The "easy_date_timeline" package is a customizable Flutter library that displays a timeline of dates in a horizontal view.
version: 1.1.4
homepage: https://github.com/FadyFayezYounan/easy_date_timeline.git

topics:
  - calendar
  - picker
  - widgets
  - timeline
  - date-time

environment:
  # Flutter SDK supported versions
  flutter: '>=3.32.5'

  # Dart SDK supported versions
  # https://docs.flutter.dev/release/archive
  sdk: '>=3.8.1'

dependencies:
  flutter:
    sdk: flutter
    
  # All platform supported
  #
  # A range rather than an exact version: flutter_localizations pins intl to
  # the release its SDK ships, and an exact pin here fights it on every
  # Flutter upgrade of the application
  intl: '>=0.19.0 <0.21.0'

dev_dependencies:
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

flutter:
